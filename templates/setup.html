<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup - Carlos Promoter</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <div class="logo">🎯 Carlos Promoter</div>
    </header>
    <div class="container">
        <div class="card" style="max-width: 600px; margin: 3rem auto;">
            <div class="card-title">⚙️ Initial Setup</div>
            <div class="alert alert-info">
                <strong>First Time Setup:</strong> Enter your Telegram API credentials. These will be saved permanently and won't be asked again.
            </div>
            <form id="setupForm">
                <div class="form-group">
                    <label for="api_id">Telegram API ID</label>
                    <input type="text" id="api_id" name="api_id" placeholder="Enter your API ID" required>
                    <small style="color: var(--text-lighter);">Get it from https://my.telegram.org</small>
                </div>
                <div class="form-group">
                    <label for="api_hash">Telegram API Hash</label>
                    <input type="text" id="api_hash" name="api_hash" placeholder="Enter your API Hash" required>
                    <small style="color: var(--text-lighter);">Get it from https://my.telegram.org</small>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Save & Continue</button>
            </form>
        </div>
    </div>
    <script>
        document.getElementById('setupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const apiId = document.getElementById('api_id').value.trim();
            const apiHash = document.getElementById('api_hash').value.trim();
            if (!apiId || !apiHash) {
                alert('Please enter both API ID and Hash');
                return;
            }
            const submitBtn = e.target.querySelector('button');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading"></span> Saving...';
            try {
                const response = await fetch('/save-setup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ api_id: apiId, api_hash: apiHash })
                });
                const data = await response.json();
                if (data.status === 'success') {
                    showAlert('✓ Settings saved successfully! Redirecting...', 'success');
                    setTimeout(() => window.location.href = '/', 1500);
                } else {
                    showAlert('✗ Error: ' + data.message, 'error');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = 'Save & Continue';
                }
            } catch (error) {
                showAlert('✗ Error: ' + error.message, 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Save & Continue';
            }
        });
        function showAlert(message, type) {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            document.querySelector('form').insertAdjacentElement('beforebegin', alertDiv);
            setTimeout(() => alertDiv.remove(), 3000);
        }
    </script>
</body>
</html>
